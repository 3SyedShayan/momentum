name: momentum
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.7.1
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  intl: ^0.20.2
  supercharged: ^2.1.1
  themed: ^8.1.0
  recase: ^4.1.0
  navigation_history_observer: ^1.1.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  drift: 2.33.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0
  freezed_annotation: 3.1.0
  json_annotation: 4.9.0
  flutter_form_builder: ^10.3.0+2
  flutter_lucide: ^1.11.0
  form_builder_validators: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.11.3
  flutter_gen_runner: 5.12.0 # Generates Database Code
  drift_dev: ^2.33.0
  freezed: ^3.2.5
 

flutter_gen:
  output: lib/gen/assets/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  integrations:
    flutter_svg: true


flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces/Fraunces_72pt-Regular.ttf
        - asset: fonts/Fraunces/Fraunces_72pt-Bold.ttf
          weight: 700
        - asset: fonts/Fraunces/Fraunces_72pt-SemiBold.ttf
          weight: 600
    - family: Geist
      fonts:
        - asset: fonts/Geist/Geist-Regular.ttf
        - asset: fonts/Geist/Geist-Bold.ttf
          weight: 700
        - asset: fonts/Geist/Geist-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/Geist/Geist-Italic.ttf
          style: italic
        - asset: fonts/Geist/Geist-Light.ttf
          weight: 300
        - asset: fonts/Geist/Geist-Medium.ttf
          weight: 500
        - asset: fonts/Geist/Geist-SemiBold.ttf
          weight: 600
        - asset: fonts/Geist/Geist-Thin.ttf
          weight: 100
    - family: GeistMono
      fonts:
        - asset: fonts/Geist_Mono/GeistMono-Regular.ttf
        - asset: fonts/Geist_Mono/GeistMono-Bold.ttf
          weight: 700
        - asset: fonts/Geist_Mono/GeistMono-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/Geist_Mono/GeistMono-Italic.ttf
          style: italic
        - asset: fonts/Geist_Mono/GeistMono-Light.ttf
          weight: 300
        - asset: fonts/Geist_Mono/GeistMono-Medium.ttf
          weight: 500
        - asset: fonts/Geist_Mono/GeistMono-SemiBold.ttf
          weight: 600
        - asset: fonts/Geist_Mono/GeistMono-Thin.ttf
          weight: 100

